    id: problem
    attributes:
      label: 遇到的问题或使用场景
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望的行为
      description: 说明期待看到什么，以及它如何帮助你的工作。
    validations:
      required: true
